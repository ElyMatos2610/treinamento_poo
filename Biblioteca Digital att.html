<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio POO + DOM - Biblioteca</title>
</head>
<body>
  <h1>📚 Biblioteca Tech</h1>

  <h3>Bem-vindo a nossa biblioteca</h3>
  <hr>

  <!-- 1. PAINEL DE EXIBIÇÃO (DOM + GET) -->
  <h2>Informações dos Livros</h2>
  <p>Título: <strong id="info-1">---</strong></p>
  <p>Avaliação : <strong id="info-privada">---</strong></p>
  <p>Situação: <strong id="status-livro">---</strong></p>
  <hr>

  <!-- 2. CONTROLES E FORMULÁRIOS (DOM + SET) -->
  <h3>Ações do Aplicativo</h3>
  <button onclick="alternarEmprestimo()">Emprestar / Devolver</button
  <br><br>
  
  <label for="campo-input">Digitar nova avaliação (0 a 5):</label>
  <input type="number" id="campo-input" min="0" max="5" step="any">
  <button onclick="executarSet()">Avaliar </button>
  <hr>

  <!-- 3. CONSOLE VISUAL -->
  <h3>Console de Operações:</h3>
  <div id="console-output"></div>

  <script>
    class Livro {
      #titulo;
      #avaliacao;

      constructor(titulo, avaliacao) {
        this.emprestado = false;
        this.#titulo = titulo;
        this.avaliacao = avaliacao;
       
      }

      get titulo() {
        return this.#titulo;
      }
      get avaliacao() {
        return this.#avaliacao;
      }
      
      set avaliacao(novaNota) {
        if (novaNota >= 0 && novaNota <= 5) {
          this.#avaliacao = novaNota;
        } else {
          console.error("A nota deve ser entre 0 e 5!");
          exibirNoConsole("ERRO: Sabe ler não? A nota deve ser entre 0 e 5!");
        }
      }
    }
    const livro01 = new Livro("Eragon", 4 );

    function exibirNoConsole(mensagem) {
      document.getElementById("console-output").innerHTML += `<p>> ${mensagem}</p>`;
    }

    function atualizarTela() {
      document.getElementById("info-1").textContent = livro01.titulo;
      document.getElementById("info-privada").textContent = livro01.avaliacao;
      document.getElementById("status-livro").textContent = livro01.emprestado ? "Emprestado❌" : "Disponível✅";}
function alternarEmprestimo() {
  livro01.emprestado = !livro01.emprestado;
  atualizarTela();
}
    function executarAcaoPrincipal() {
      exibirNoConsole(`Livro: ${livro01.titulo}, avaliação: ${livro01.avaliacao}`);
      atualizarTela();
    }
    
    function executarSet() {
      const campoInput = document.getElementById("campo-input");
      if (campoInput.value === "") {
        exibirNoConsole("Digite uma nota de 0 a 5!");
        return;
      }
      const valorDigitado = Number(campoInput.value);
      livro01.avaliacao = valorDigitado;
      atualizarTela();
    }

    exibirNoConsole("Biblioteca carregada com sucesso!");
    atualizarTela();
  </script>
</body>
</html>
</html>
